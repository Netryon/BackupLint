name: Publish containers

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version without the v prefix
        required: true
        default: "1.0.0"
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish ${{ matrix.component }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: controller
            dockerfile: Dockerfile.controller
            image: backuplint-controller
          - component: agent
            dockerfile: Dockerfile.agent
            image: backuplint-agent
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: meta
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "${VERSION}" ]; then
            echo "Unable to resolve image version" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "revision=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: |
            ghcr.io/netryon/${{ matrix.image }}:${{ steps.meta.outputs.version }}
            ghcr.io/netryon/${{ matrix.image }}:v${{ steps.meta.outputs.version }}
            ghcr.io/netryon/${{ matrix.image }}:latest
          build-args: |
            BACKUPLINT_VERSION=${{ steps.meta.outputs.version }}
            BACKUPLINT_REVISION=${{ steps.meta.outputs.revision }}

      - name: Record digest
        run: |
          echo "Published ghcr.io/netryon/${{ matrix.image }}@${{ steps.push.outputs.digest }}"
