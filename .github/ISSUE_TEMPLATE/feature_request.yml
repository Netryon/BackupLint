name: Feature request
description: Suggest an improvement or new capability
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
      description: Describe the behavior or workflow you would like.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Coverage
        - Integrity
        - Restore verification
        - Standalone
        - Agent
        - Controller / fleet
        - Dashboard
        - Policy / GitOps
        - SIEM
        - Installer / packaging
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: I understand BackupLint is a backup-assurance layer, not a backup engine or disaster-recovery orchestrator.
          required: true
